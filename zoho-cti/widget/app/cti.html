<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exotel CTI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="cti.css" />
</head>
<body class="cti">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-phone" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></symbol>
    <symbol id="i-hang" viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-1.6 0-3.2.3-4.6.7v3.1c0 .4-.2.7-.6.9-1 .5-1.9 1.1-2.6 1.8-.2.2-.4.3-.7.3s-.5-.1-.7-.3L.3 13c-.2-.2-.3-.4-.3-.7s.1-.5.3-.7A16.4 16.4 0 0 1 12 7c4.6 0 8.7 1.8 11.7 4.6.2.2.3.4.3.7s-.1.5-.3.7l-2.5 2.5c-.2.2-.4.3-.7.3s-.5-.1-.7-.3c-.8-.7-1.7-1.3-2.6-1.8-.3-.2-.6-.5-.6-.9V9.7C15.2 9.3 13.6 9 12 9z"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/></symbol>
    <symbol id="i-micoff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20"/><path d="M9 9v2a3 3 0 0 0 5.1 2.1M15 9.3V5a3 3 0 0 0-5.9-.8"/><path d="M17 16.9A7 7 0 0 1 5 11v-1M19 10v1c0 .8-.1 1.5-.4 2.2"/><path d="M12 18v4"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="5" r="1.8"/><circle cx="12" cy="5" r="1.8"/><circle cx="18" cy="5" r="1.8"/><circle cx="6" cy="11" r="1.8"/><circle cx="12" cy="11" r="1.8"/><circle cx="18" cy="11" r="1.8"/><circle cx="6" cy="17" r="1.8"/><circle cx="12" cy="17" r="1.8"/><circle cx="18" cy="17" r="1.8"/><circle cx="12" cy="22.2" r="1.6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></symbol>
    <symbol id="i-in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7L7 17"/><path d="M16 17H7V8"/></symbol>
    <symbol id="i-miss" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l6 6 4-4 8 8"/><path d="M21 11v6h-6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.1v13.8c0 .8.9 1.3 1.6.8l10.4-6.9c.6-.4.6-1.2 0-1.6L9.6 4.3C8.9 3.8 8 4.3 8 5.1z"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.3"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-del" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-5 6M12 9l5 6"/></symbol>
  </svg>

  <!-- the device you work on -->
  <header class="top">
    <div class="seg" id="inSeg" role="radiogroup" aria-label="The device you work on">
      <button type="button" role="radio" data-v="Desktop">Desktop</button><button type="button" role="radio" data-v="Phone">Phone</button>
    </div>
    <span class="grow"></span>
    <button type="button" class="icon-btn" id="setBtn" title="Settings"><svg><use href="#i-gear"/></svg></button>
    <button type="button" class="icon-btn dock-min" id="dockMin" title="Minimise" hidden><svg><use href="#i-caret"/></svg></button>
  </header>

  <!-- the docked phone, minimised: one line at the bottom right of the page -->
  <div class="dock-bar" id="dockBar" hidden>
    <i class="dot" id="dockDot"></i>
    <span class="dock-text" id="dockText">Phone</span>
    <button type="button" class="btn primary dock-call" id="dockCall" hidden></button>
    <button type="button" class="icon-btn dock-open" id="dockOpen" title="Open the phone"><svg><use href="#i-caret"/></svg></button>
  </div>

  <div class="notice" id="notice" hidden><span id="noticeText"></span><button type="button" id="noticeBtn" hidden></button></div>

  <main>
    <!-- dialer -->
    <section class="view" id="vDial">
      <div class="contact" id="contact" hidden>
        <div class="c-head">
          <span class="avatar" id="cInitials"></span>
          <div class="c-id">
            <button type="button" class="c-name" id="cName" title="Open in Zoho"></button>
            <div class="c-org" id="cOrg"></div>
          </div>
          <span class="tag" id="cStatus" hidden></span>
        </div>
        <div class="c-nums" id="cNums" role="radiogroup" aria-label="Number to call"></div>
      </div>

      <div class="pad" id="pad">
        <div class="dial-row">
          <input class="dial-input" id="dialInput" type="tel" inputmode="tel" placeholder="Enter a number" autocomplete="off" />
          <button type="button" class="icon-btn" id="dialDel" title="Delete" hidden><svg><use href="#i-del"/></svg></button>
        </div>
        <div class="keys" id="keys"></div>
      </div>

      <div class="actions">
        <button type="button" class="round ghost" id="padBtn" title="Keypad"><svg><use href="#i-grid"/></svg></button>
        <button type="button" class="round call" id="callBtn" title="Call" disabled><svg><use href="#i-phone"/></svg></button>
        <button type="button" class="round ghost" id="histBtn" title="Call history"><svg><use href="#i-clock"/></svg></button>
      </div>

      <div class="recent" id="recent" hidden>
        <div class="sec-head"><span id="recentTitle">Recent calls</span><button type="button" class="link" id="recentAll">All</button></div>
        <ul class="hist" id="recentList"></ul>
      </div>
    </section>

    <!-- settings -->
    <section class="view settings" id="vSet" hidden>
      <div class="h-bar">
        <button type="button" class="icon-btn" id="setBack" title="Back"><svg><use href="#i-back"/></svg></button>
        <span class="h-title">Settings</span>
      </div>
      <div class="opt-row">
        <span class="opt-label">Outgoing calls</span>
        <div class="seg" id="outSeg" role="radiogroup" aria-label="How your calls go out">
          <button type="button" role="radio" data-v="SIP">SIP</button><button type="button" role="radio" data-v="Phone">Number</button>
        </div>
      </div>
      <dl class="opt-info">
        <dt>Incoming calls</dt><dd id="setIn"></dd>
        <dt>Your number</dt><dd id="setNum"></dd>
        <dt>Caller ID</dt><dd id="setCid"></dd>
      </dl>
    </section>

    <!-- a call in progress or ringing -->
    <section class="view live" id="vLive" hidden>
      <div class="l-head">
        <span class="avatar lg" id="lInitials"></span>
        <button type="button" class="l-name" id="lName" title="Open in Zoho"></button>
        <div class="l-sub" id="lSub"></div>
        <button type="button" class="link l-open" id="lOpen" hidden>Open lead</button>
        <div class="l-state" id="lState"></div>
        <div class="l-timer" id="lTimer" hidden>00:00</div>
      </div>
      <div class="ctl-grid" id="ctls" hidden>
        <button type="button" class="ctl" id="muteBtn"><span class="ctl-ic"><svg><use href="#i-mic"/></svg></span><span>Mute</span></button>
        <button type="button" class="ctl" id="kpBtn"><span class="ctl-ic"><svg><use href="#i-grid"/></svg></span><span>Keypad</span></button>
        <button type="button" class="ctl" id="holdBtn"><span class="ctl-ic"><svg><use href="#i-pause"/></svg></span><span>Hold</span></button>
      </div>
      <div class="dtmf" id="dtmf" hidden>
        <div class="dtmf-echo" id="dtmfEcho"></div>
        <div class="keys" id="dtmfKeys"></div>
      </div>
      <div class="actions">
        <button type="button" class="round call" id="answerBtn" title="Answer" hidden><svg><use href="#i-phone"/></svg></button>
        <button type="button" class="round hang" id="hangBtn" title="End call"><svg><use href="#i-hang"/></svg></button>
      </div>
    </section>

    <!-- after a call: its result and the disposition -->
    <section class="view wrapup" id="vWrap" hidden>
      <div class="w-head">
        <div class="w-name" id="wName"></div>
        <div class="w-result"><span class="badge" id="wStatus"></span><span class="w-dur" id="wDur"></span></div>
      </div>
      <div class="field">
        <div class="label">Disposition</div>
        <div class="chips" id="d1"></div>
      </div>
      <div class="field" id="d2Wrap" hidden>
        <div class="label">Sub disposition</div>
        <div class="chips" id="d2"></div>
      </div>
      <div class="field">
        <div class="label">Note</div>
        <textarea id="dNote" rows="2" maxlength="500"></textarea>
      </div>
      <div class="w-actions">
        <button type="button" class="btn primary" id="dSave" disabled>Save</button>
        <button type="button" class="btn" id="dSkip">Skip</button>
      </div>
      <div class="form-msg" id="dMsg"></div>
    </section>

    <!-- call history -->
    <section class="view history" id="vHist" hidden>
      <div class="h-bar">
        <button type="button" class="icon-btn" id="histBack" title="Back"><svg><use href="#i-back"/></svg></button>
        <div class="h-tabs" id="histTabs" role="tablist">
          <button type="button" data-f="all" class="on" role="tab">All</button>
          <button type="button" data-f="missed" role="tab">Missed</button>
          <button type="button" data-f="todo" role="tab">No disposition</button>
          <button type="button" data-f="record" id="histRecTab" role="tab" hidden>This lead</button>
        </div>
        <button type="button" class="icon-btn" id="histRefresh" title="Refresh"><svg><use href="#i-refresh"/></svg></button>
      </div>
      <div class="h-filters" id="histFilters">
        <select id="fAgent" aria-label="Whose calls" hidden>
          <option value="">Everyone</option>
          <option value="me">My calls</option>
        </select>
        <select id="fDir" aria-label="Direction">
          <option value="">In and out</option>
          <option value="in">Incoming</option>
          <option value="out">Outgoing</option>
        </select>
        <select id="fSince" aria-label="When">
          <option value="">Any time</option>
          <option value="0">Today</option>
          <option value="6">Last 7 days</option>
          <option value="29">Last 30 days</option>
        </select>
        <select id="fDisp" aria-label="Disposition">
          <option value="">Any disposition</option>
        </select>
        <input id="fSearch" type="search" placeholder="Name or number" aria-label="Search calls" />
      </div>
      <ul class="hist" id="histList"></ul>
      <button type="button" class="btn more" id="histMore" hidden>Load more</button>
    </section>
  </main>

  <footer class="foot" id="foot"><i class="dot" id="lineDot"></i><span id="lineText">Connecting</span><button type="button" class="link" id="lineFix" hidden>Reconnect</button><button type="button" class="link" id="phoneLink" title="Keeps your line ready, and rings for incoming calls" hidden>Open Phone tab</button><span class="grow"></span><span id="cidText"></span></footer>

  <script src="cti-timers.js"></script>
  <script src="https://live.zwidgets.com/js-sdk/1.5/ZohoEmbededAppSDK.min.js"></script>
  <script src="exotel-websdk.bundle.js"></script>
  <script src="cti-common.js"></script>
  <script src="cti-sounds.js"></script>
  <script src="cti.js"></script>
</body>
</html>
